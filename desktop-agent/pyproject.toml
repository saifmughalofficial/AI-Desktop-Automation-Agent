[project]
name = "ai-desktop-automation-agent"
version = "1.1.0"
description = "Local-first, policy-guarded desktop automation agent with a rules engine and optional local LLM (no paid APIs)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pydantic>=2.6",
    "psutil>=5.9",
    "reportlab>=4.0",
    "pandas>=2.0",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
package = ["pyinstaller>=6"]

[project.scripts]
desktop-agent = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::UserWarning:pywinauto"]
